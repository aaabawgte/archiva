name: Objavi web na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v6
      - name: Postavi Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Instaliraj pakete
        run: npm ci
      - name: Provjeri API adresu
        env:
          ARCHIVA_API_URL: ${{ vars.ARCHIVA_API_URL }}
        run: test -n "$ARCHIVA_API_URL"
      - name: Izgradi aplikaciju
        run: npm run build
      - name: Upiši produkcijski API URL
        env:
          ARCHIVA_API_URL: ${{ vars.ARCHIVA_API_URL }}
        run: node -e "const fs=require('fs'); const p='dist/config.js'; fs.writeFileSync(p, fs.readFileSync(p,'utf8').replace('http://localhost:8787', process.env.ARCHIVA_API_URL))"
      - name: Postavi Pages
        uses: actions/configure-pages@v5
      - name: Prenesi Pages artefakt
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Objavi GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
